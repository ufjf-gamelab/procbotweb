<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>debug viewport</title>
<style>
  body { background:#111; color:#0f0; font: 20px/1.5 monospace; padding: 16px; margin:0; }
  div { margin-bottom: 8px; word-break: break-all; }
</style>
</head>
<body>
<div id="out">carregando...</div>
<script>
function render() {
  var lines = [];
  lines.push('innerWidth: ' + window.innerWidth);
  lines.push('innerHeight: ' + window.innerHeight);
  lines.push('outerWidth: ' + window.outerWidth);
  lines.push('outerHeight: ' + window.outerHeight);
  lines.push('screen.width: ' + screen.width);
  lines.push('screen.height: ' + screen.height);
  lines.push('devicePixelRatio: ' + window.devicePixelRatio);
  lines.push('visualViewport.width: ' + (window.visualViewport ? window.visualViewport.width : 'n/a'));
  lines.push('visualViewport.height: ' + (window.visualViewport ? window.visualViewport.height : 'n/a'));
  lines.push('orientation match landscape: ' + window.matchMedia('(orientation: landscape)').matches);
  lines.push('landscape-mobile match (max-height:500): ' + window.matchMedia('(orientation: landscape) and (max-height: 500px)').matches);
  lines.push('portrait-mobile match (max-width:480): ' + window.matchMedia('(max-width: 480px) and (orientation: portrait)').matches);
  lines.push('max-width:1280 match: ' + window.matchMedia('(max-width: 1280px)').matches);
  lines.push('UA: ' + navigator.userAgent);
  document.getElementById('out').innerHTML = lines.map(function(l){ return '<div>' + l + '</div>'; }).join('');
}
render();
window.addEventListener('resize', render);
window.addEventListener('orientationchange', function(){ setTimeout(render, 300); });
</script>
</body>
</html>
